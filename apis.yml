aid: dualbird
name: Dualbird
description: >-
  Dualbird is a data and AI infrastructure company building accelerated data
  processing systems that speed up Apache Spark and Amazon EMR workloads by
  10x-30x at 50%-90% lower cost, without code changes or migration. Founded by
  Gilad Tal (CEO), Ohad Gamliel (Chief Engineer), and Ehud Eliaz (Chief Hardware
  Architect) - a team with deep ASIC, FPGA, and high-performance computing
  expertise - Dualbird optimizes enterprise data pipelines at the hardware and
  software level to remove processing bottlenecks and let organizations maximize
  data utilization beyond current GPU capabilities. The company raised a $25M
  round backed by Lightspeed Venture Partners and Uncork Capital. As of this
  enrichment pass Dualbird publishes a marketing and company site only - no
  public API, developer documentation, SDKs, or GitHub organization were found.
